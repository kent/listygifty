name: listygifty-local

services:
  db:
    image: postgres:16-alpine
    container_name: listygifty-local-postgres
    environment:
      POSTGRES_USER: listygifty
      POSTGRES_PASSWORD: listygifty
      POSTGRES_DB: niftygifty_development
    ports:
      - "${LISTYGIFTY_DB_PORT:-5432}:5432"
    volumes:
      - listygifty-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listygifty -d niftygifty_development"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: listygifty-local-api
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://listygifty:listygifty@db:5432/niftygifty_development
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      SMTP_ADDRESS: mailpit
      SMTP_PORT: "1025"
      PORT: "3001"
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3001/up"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: listygifty-local-worker
    command: bin/jobs
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://listygifty:listygifty@db:5432/niftygifty_development
      FRONTEND_URL: http://localhost:3000
      SMTP_ADDRESS: mailpit
      SMTP_PORT: "1025"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: listygifty-local-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: listygifty-local-web
    env_file:
      - ./apps/web/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      INTERNAL_API_URL: http://api:3001
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
    depends_on:
      api:
        condition: service_healthy

volumes:
  listygifty-postgres-data:
