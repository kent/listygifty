config:
  gcp:project: listygifty
  gcp:region: us-central1
  niftygifty:environment: production
  niftygifty:apiService: listygifty-api-prod
  niftygifty:webService: listygifty-web-prod
  niftygifty:migrationJob: listygifty-migrate-prod
  niftygifty:webServiceAccountName: niftygifty-runner
  niftygifty:secretPrefix: niftygifty-
  niftygifty:railsKeySecret: listygifty-rails-key-prod
  niftygifty:appDomain: listygifty.com
  niftygifty:apiDomain: api.listygifty.com
  niftygifty:wwwDomain: www.listygifty.com
  niftygifty:apiMinInstances: "1"
  # Each API instance runs Puma plus Solid Queue (supervisor, dispatcher,
  # worker, scheduler) and holds ~10-12 Postgres connections. The Cloud SQL
  # instance (db-custom-1-3840 since 2026-11-18; tier is managed outside
  # Pulumi) allows 100 connections with 3 reserved, so 6 instances (~72)
  # leaves room for the migration job and deploy overlap. On db-f1-micro
  # (~22 usable) a 3rd instance locked the DB out (2026-11-16 outage).
  # Raise only alongside Postgres max_connections.
  niftygifty:apiMaxInstances: "6"
  niftygifty:apiConcurrency: "10"
  niftygifty:webMinInstances: "1"
  niftygifty:webMaxInstances: "10"
  niftygifty:webConcurrency: "80"
  niftygifty:apiPort: "3000"
  niftygifty:webPort: "8080"
  niftygifty:sqlInstance: niftygifty-postgres-central
  niftygifty:imageRegistry: gcr.io/listygifty
  niftygifty:apiImageRepo: niftygifty-api
  niftygifty:webImageRepo: listygifty-web
  niftygifty:androidAppLinkSha256CertFingerprints: ""
  niftygifty:sourceSha: 8ae1257e2ff3-d0ad61bedb30
  niftygifty:legacyRollback: false
