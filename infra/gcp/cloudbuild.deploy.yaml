options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s

steps:
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env:
      - SHORT_SHA=$SHORT_SHA
      - COMMIT_SHA=$COMMIT_SHA
      - PROJECT_ID=$PROJECT_ID
    args:
      - -lc
      - |
        set -euo pipefail

        ENVIRONMENT="${_ENVIRONMENT:?_ENVIRONMENT substitution is required}"
        ENABLE_MOBILE="${_ENABLE_MOBILE:-false}"

        apt-get update -qq
        apt-get install -y --no-install-recommends ca-certificates curl git nodejs npm
        curl -fsSL https://get.pulumi.com | sh
        export PATH="${HOME}/.pulumi/bin:${PATH}"

        pulumi login gs://listygifty-pulumi-state
        ENABLE_MOBILE="${ENABLE_MOBILE}" bash infra/pulumi/scripts/deploy.sh "${ENVIRONMENT}"
