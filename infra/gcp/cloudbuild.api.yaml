options:
  machineType: E2_HIGHCPU_8

# Layer caching: the builder stage (bundle install) and final image are pushed
# as :buildcache* tags with inline cache metadata, so an unchanged Gemfile
# skips bundle install entirely on the next deploy.
steps:
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - --target
      - builder
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - --cache-from
      - ${_CACHE_BUILDER}
      - -t
      - ${_CACHE_BUILDER}
      - apps/api
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - --cache-from
      - ${_CACHE_BUILDER}
      - --cache-from
      - ${_CACHE_IMAGE}
      - -t
      - ${_IMAGE}
      - -t
      - ${_CACHE_IMAGE}
      - apps/api
images:
  - ${_IMAGE}
  - ${_CACHE_IMAGE}
  - ${_CACHE_BUILDER}
