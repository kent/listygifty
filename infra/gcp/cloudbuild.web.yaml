options:
  substitutionOption: ALLOW_LOOSE
  machineType: E2_HIGHCPU_8

# Layer caching: the deps stage (npm ci) and final image are pushed as
# :buildcache* tags with inline cache metadata, so unchanged lockfiles skip
# npm ci entirely on the next deploy.
steps:
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --target
      - deps
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - --cache-from
      - ${_CACHE_DEPS}
      - -t
      - ${_CACHE_DEPS}
      - .
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - -t
      - ${_IMAGE}
      - -t
      - ${_CACHE_IMAGE}
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - --cache-from
      - ${_CACHE_DEPS}
      - --cache-from
      - ${_CACHE_IMAGE}
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - --build-arg
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL=${_NEXT_PUBLIC_CLERK_SIGN_IN_URL}
      - --build-arg
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL=${_NEXT_PUBLIC_CLERK_SIGN_UP_URL}
      - --build-arg
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=${_NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL}
      - --build-arg
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=${_NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL}
      - --build-arg
      - NEXT_PUBLIC_POSTHOG_KEY=${_NEXT_PUBLIC_POSTHOG_KEY}
      - --build-arg
      - NEXT_PUBLIC_POSTHOG_HOST=${_NEXT_PUBLIC_POSTHOG_HOST}
      - .
images:
  - ${_IMAGE}
  - ${_CACHE_IMAGE}
  - ${_CACHE_DEPS}
