name: Deploy

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'infra/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      enable_mobile:
        description: 'Queue the iOS EAS build after web/API deploy'
        required: true
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
      cancel-in-progress: false
    env:
      PULUMI_BACKEND_URL: gs://listygifty-pulumi-state
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      ASC_KEY_ID: 2XG664G4GG

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "${HOME}/.pulumi/bin" >> "${GITHUB_PATH}"

      - name: Resolve environment
        id: env
        shell: bash
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment || '' }}
          INPUT_ENABLE_MOBILE: ${{ inputs.enable_mobile || '' }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            environment="${INPUT_ENVIRONMENT}"
            enable_mobile="${INPUT_ENABLE_MOBILE:-true}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            environment="production"
            enable_mobile="true"
          elif [ "${GITHUB_REF_NAME}" = "staging" ]; then
            environment="staging"
            enable_mobile="true"
          else
            echo "::error title=Unsupported branch::${GITHUB_REF_NAME} cannot deploy."
            exit 1
          fi

          {
            echo "environment=${environment}"
            echo "enable_mobile=${enable_mobile}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install root dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Log in to Pulumi state backend
        run: pulumi login "${PULUMI_BACKEND_URL}"

      - name: Deploy API, web, database migrations, smoke tests, and mobile
        env:
          ENABLE_MOBILE: ${{ steps.env.outputs.enable_mobile }}
        run: npm run deploy:${{ steps.env.outputs.environment }}
