name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'infra/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      enable_mobile:
        description: 'Queue the iOS EAS build after web/API deploy'
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PULUMI_BACKEND_URL: gs://listygifty-pulumi-state
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      ASC_KEY_ID: 2XG664G4GG
      ENABLE_MOBILE: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_mobile || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "${HOME}/.pulumi/bin" >> "${GITHUB_PATH}"

      - name: Install root dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Log in to Pulumi state backend
        run: pulumi login "${PULUMI_BACKEND_URL}"

      - name: Deploy API, web, and database migrations
        run: npm run deploy:production
