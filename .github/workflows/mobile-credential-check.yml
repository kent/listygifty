name: Mobile Credential Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 1 * *'

jobs:
  ios-signing-credentials:
    name: iOS Signing Credential Expiry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate EAS iOS signing credential expiry
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          IOS_CREDENTIAL_EXPIRY_WARN_DAYS: 90
          IOS_CREDENTIAL_EXPIRY_FAIL_DAYS: 30
        run: node scripts/ci/check-ios-credential-expiry.mjs
