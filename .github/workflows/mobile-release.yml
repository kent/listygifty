name: Mobile Release
run-name: ${{ github.event_name == 'issue_comment' && format('TestFlight from PR {0}', github.event.issue.number) || github.event_name == 'workflow_dispatch' && format('Mobile {0}', inputs.release_action) || github.ref_name }}

on:
  issue_comment:
    types:
      - created
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_action:
        description: 'What should this run do?'
        required: true
        default: testflight
        type: choice
        options:
          - testflight
          - app_store_review
      eas_profile:
        description: 'EAS build/submit profile for TestFlight uploads'
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      app_version:
        description: 'App version to promote for App Store review; defaults to apps/mobile/app.json'
        required: false
        type: string
      whats_new:
        description: 'App Store release notes for review promotion'
        required: false
        default: 'Bug fixes and performance improvements.'
        type: string
      app_store_release_type:
        description: 'When an approved App Store version is released'
        required: true
        default: MANUAL
        type: choice
        options:
          - MANUAL
          - AFTER_APPROVAL
          - SCHEDULED

permissions:
  contents: read
  pull-requests: read

env:
  ASC_APP_ID: '6759929474'
  ASC_KEY_ID: 2XG664G4GG
  ASC_ISSUER_ID: 69a6de6e-8f71-47e3-e053-5b8c7c11a4d1

jobs:
  authorize:
    name: Authorize Merged Commit
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.body == '/testflight' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve trusted release target
        id: target
        shell: bash
        env:
          DEFAULT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          target_sha="${DEFAULT_SHA}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${REF_NAME}" != "main" ]; then
              echo "Manual mobile releases must run from main." >&2
              exit 1
            fi
          elif [ "${EVENT_NAME}" = "issue_comment" ]; then
            pr_json="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")"
            merged_at="$(jq -r '.merged_at // empty' <<<"${pr_json}")"
            base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
            target_sha="$(jq -r '.merge_commit_sha // empty' <<<"${pr_json}")"

            if [ -z "${merged_at}" ] || [ "${base_ref}" != "main" ] || [ -z "${target_sha}" ]; then
              echo "PR #${PR_NUMBER} must be merged into main before a TestFlight build." >&2
              exit 1
            fi
          elif [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Unsupported mobile release event: ${EVENT_NAME} (${GITHUB_REF})." >&2
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "${target_sha}" origin/main; then
            echo "Release target ${target_sha} is not merged into main." >&2
            exit 1
          fi

          echo "sha=${target_sha}" >> "${GITHUB_OUTPUT}"

  release-context:
    name: Release Context
    runs-on: ubuntu-latest
    needs: [authorize]
    outputs:
      release_action: ${{ steps.context.outputs.release_action }}
      eas_profile: ${{ steps.context.outputs.eas_profile }}
      app_version: ${{ steps.context.outputs.app_version }}
      whats_new: ${{ steps.context.outputs.whats_new }}
      app_store_release_type: ${{ steps.context.outputs.app_store_release_type }}
      target_sha: ${{ steps.context.outputs.target_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compute release context
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_ACTION: ${{ inputs.release_action || '' }}
          INPUT_EAS_PROFILE: ${{ inputs.eas_profile || '' }}
          INPUT_APP_VERSION: ${{ inputs.app_version || '' }}
          INPUT_WHATS_NEW: ${{ inputs.whats_new || '' }}
          INPUT_APP_STORE_RELEASE_TYPE: ${{ inputs.app_store_release_type || '' }}
          TARGET_SHA: ${{ needs.authorize.outputs.target_sha }}
        run: |
          set -euo pipefail

          app_version="$(node -p "require('./apps/mobile/app.json').expo.version")"
          if [ -n "${INPUT_APP_VERSION}" ]; then
            app_version="${INPUT_APP_VERSION}"
          fi

          release_action="none"
          eas_profile="${INPUT_EAS_PROFILE:-production}"
          whats_new="${INPUT_WHATS_NEW:-Bug fixes and performance improvements.}"
          app_store_release_type="${INPUT_APP_STORE_RELEASE_TYPE:-MANUAL}"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            release_action="${INPUT_RELEASE_ACTION:-testflight}"
          fi

          if [ "${EVENT_NAME}" = "issue_comment" ]; then
            release_action="testflight"
            eas_profile="production"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "${tag_version}" != "${app_version}" ]; then
              echo "::error title=Version tag mismatch::Tag ${GITHUB_REF_NAME} does not match apps/mobile/app.json version ${app_version}."
              exit 1
            fi
            release_action="testflight"
            eas_profile="production"
          fi

          {
            echo "release_action=${release_action}"
            echo "eas_profile=${eas_profile}"
            echo "app_version=${app_version}"
            echo "whats_new<<EOF"
            echo "${whats_new}"
            echo "EOF"
            echo "app_store_release_type=${app_store_release_type}"
            echo "target_sha=${TARGET_SHA}"
          } >> "${GITHUB_OUTPUT}"

  mobile-quality:
    name: Mobile Quality Gate
    runs-on: ubuntu-latest
    needs: [release-context]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.target_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install root workspace dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Build shared packages
        run: |
          npm --prefix packages/types run build
          npm --prefix packages/api-client run build
          npm --prefix packages/services run build

      - name: Install mobile dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false --prefix apps/mobile

      - name: Check Expo dependency versions
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Run mobile tests
        working-directory: apps/mobile
        run: npm test -- --runInBand

  release-preflight:
    name: Mobile Release Preflight
    runs-on: ubuntu-latest
    needs: [release-context, mobile-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.target_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check required release secrets
        shell: bash
        env:
          RELEASE_ACTION: ${{ needs.release-context.outputs.release_action }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail

          missing=()
          if [ "${RELEASE_ACTION}" = "testflight" ]; then
            [ -n "${EXPO_TOKEN:-}" ] || missing+=("EXPO_TOKEN")
            [ -n "${APP_STORE_CONNECT_API_KEY_P8:-}" ] || missing+=("APP_STORE_CONNECT_API_KEY_P8")
          fi
          if [ "${RELEASE_ACTION}" = "app_store_review" ]; then
            [ -n "${APP_STORE_CONNECT_API_KEY_P8:-}" ] || missing+=("APP_STORE_CONNECT_API_KEY_P8")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf -v missing_list '%s, ' "${missing[@]}"
            missing_list="${missing_list%, }"
            echo "::error title=Mobile release blocked::Missing GitHub secrets: ${missing_list}."
            exit 1
          fi

      - name: Validate EAS iOS signing credential expiry
        if: ${{ needs.release-context.outputs.release_action == 'testflight' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          IOS_CREDENTIAL_EXPIRY_WARN_DAYS: 90
          IOS_CREDENTIAL_EXPIRY_FAIL_DAYS: 30
        run: node scripts/ci/check-ios-credential-expiry.mjs

  testflight:
    name: Queue TestFlight Build
    runs-on: ubuntu-latest
    needs: [release-context, release-preflight]
    if: ${{ needs.release-context.outputs.release_action == 'testflight' }}
    concurrency:
      group: mobile-testflight-ios
      cancel-in-progress: false
    environment:
      name: mobile-testflight
      url: https://appstoreconnect.apple.com/apps/6759929474/testflight/ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.target_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false --prefix apps/mobile

      - name: Prepare mobile release credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MOBILE_STORE_RELEASE: 'true'
          ASC_KEY_ID: ${{ env.ASC_KEY_ID }}
        run: bash scripts/ci/prepare-mobile-release-secrets.sh

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Verify EAS authentication
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Queue production-profile TestFlight build
        id: queue-build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROFILE: ${{ needs.release-context.outputs.eas_profile }}
          TARGET_SHA: ${{ needs.release-context.outputs.target_sha }}
        run: |
          set -euo pipefail
          args=(
            build
            --profile "${EAS_PROFILE}"
            --platform ios
            --auto-submit
            --non-interactive
            --no-wait
            --message "${GITHUB_REF_NAME} ${TARGET_SHA}"
          )
          eas "${args[@]}"

          # jq variables are intentionally quoted for jq rather than expanded by the shell.
          # shellcheck disable=SC2016
          jq_args=(
            -er
            --arg sha "${TARGET_SHA}"
            --arg profile "${EAS_PROFILE}"
            'first(.[] | select(.gitCommitHash == $sha and .buildProfile == $profile)) | [.id, .appBuildVersion] | @tsv'
          )
          build_metadata=""
          for _ in {1..5}; do
            queued_builds="$(eas build:list \
              --platform ios \
              --build-profile "${EAS_PROFILE}" \
              --git-commit-hash "${TARGET_SHA}" \
              --limit 1 \
              --json \
              --non-interactive)"
            if build_metadata="$(printf '%s' "${queued_builds}" | jq "${jq_args[@]}")"; then
              break
            fi
            sleep 5
          done

          [ -n "${build_metadata}" ] || { echo "Could not identify the queued EAS build" >&2; exit 1; }
          IFS=$'\t' read -r build_id build_number <<< "${build_metadata}"
          {
            echo "build_id=${build_id}"
            echo "build_number=${build_number}"
          } >> "${GITHUB_OUTPUT}"
          echo "Queued EAS build ${build_id} (build ${build_number})."

      - name: Verify TestFlight group attachment
        env:
          ASC_KEY_ID: ${{ env.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_APP_ID: ${{ env.ASC_APP_ID }}
          ASC_VERSION_STRING: ${{ needs.release-context.outputs.app_version }}
          ASC_BUILD_NUMBER: ${{ steps.queue-build.outputs.build_number }}
          ASC_BETA_GROUP_NAME: Internal Testers
          ASC_REQUIRED_TESTER_EMAIL: kent.fenwick@gmail.com
          ASC_WAIT_ATTEMPTS: 60
          ASC_WAIT_SECONDS: 60
        run: node scripts/ci/attach-testflight-build-to-group.mjs

      - name: Publish TestFlight summary
        run: |
          {
            echo "## TestFlight"
            echo ""
            echo "- EAS profile: \`${{ needs.release-context.outputs.eas_profile }}\`"
            echo "- App version: \`${{ needs.release-context.outputs.app_version }}\`"
            echo "- Build number: \`${{ steps.queue-build.outputs.build_number }}\`"
            echo "- Source: \`${{ needs.release-context.outputs.target_sha }}\`"
            echo "- Tester group: \`Internal Testers\` for the production profile"
            echo "- Build: https://expo.dev/accounts/kentf/projects/niftygifty/builds/${{ steps.queue-build.outputs.build_id }}"
            echo "- App Store Connect: https://appstoreconnect.apple.com/apps/6759929474/testflight/ios"
          } >> "${GITHUB_STEP_SUMMARY}"

  app-store-review:
    name: Promote To App Store Review
    runs-on: ubuntu-latest
    needs: [release-context, release-preflight]
    if: ${{ needs.release-context.outputs.release_action == 'app_store_review' }}
    concurrency:
      group: mobile-app-store-review-ios
      cancel-in-progress: false
    environment:
      name: mobile-production
      url: https://appstoreconnect.apple.com/apps/6759929474/distribution

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-context.outputs.target_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare App Store Connect key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MOBILE_APP_STORE_REVIEW: 'true'
          ASC_KEY_ID: ${{ env.ASC_KEY_ID }}
        run: bash scripts/ci/prepare-mobile-release-secrets.sh

      - name: Submit latest processed TestFlight build for review
        env:
          ASC_KEY_ID: ${{ env.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_APP_ID: ${{ env.ASC_APP_ID }}
          ASC_VERSION_STRING: ${{ needs.release-context.outputs.app_version }}
          ASC_WHATS_NEW: ${{ needs.release-context.outputs.whats_new }}
          ASC_RELEASE_TYPE: ${{ needs.release-context.outputs.app_store_release_type }}
        run: node scripts/ci/submit-ios-for-review.mjs

      - name: Publish App Store review summary
        run: |
          {
            echo "## App Store Review"
            echo ""
            echo "- App version: \`${{ needs.release-context.outputs.app_version }}\`"
            echo "- Release type after approval: \`${{ needs.release-context.outputs.app_store_release_type }}\`"
            echo "- App Store Connect: https://appstoreconnect.apple.com/apps/6759929474/distribution"
          } >> "${GITHUB_STEP_SUMMARY}"
