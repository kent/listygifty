name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the previous run; don't finish stale work.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: apps/api

      - name: Scan Rails code
        run: bin/brakeman --no-pager

      - name: Scan Ruby dependencies
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install root workspace dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Reject high and critical root vulnerabilities
        run: node scripts/ci/npm-audit.mjs

      - name: Install mobile dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false --prefix apps/mobile

      - name: Reject high and critical mobile vulnerabilities
        run: node scripts/ci/npm-audit.mjs --prefix apps/mobile

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/pulumi/package-lock.json

      - name: Install infrastructure dependencies
        run: npm ci --prefer-offline --no-audit --progress=false --prefix infra/pulumi

      - name: Scan infrastructure dependencies
        run: node scripts/ci/npm-audit.mjs --prefix infra/pulumi

      - name: Typecheck infrastructure
        working-directory: infra/pulumi
        run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: apps/api

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('apps/api/.ruby-version', 'apps/api/**/.rubocop.yml', 'apps/api/**/.rubocop_todo.yml', 'apps/api/Gemfile.lock') }}
        with:
          path: apps/api/${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.run_id }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint Rails code
        working-directory: apps/api
        run: bin/rubocop -f github

      - name: Install root workspace dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Build shared web packages
        run: |
          npm --prefix packages/types run build
          npm --prefix packages/api-client run build
          npm --prefix packages/services run build

      - name: Lint and typecheck web app
        run: |
          npm --prefix apps/web run lint
          npm --prefix apps/web run typecheck

  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niftygifty_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: apps/api

      - name: Run API tests
        working-directory: apps/api
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/niftygifty_test
        # One worker per runner CPU; Rails gives each worker its own database.
        run: PARALLEL_WORKERS=$(nproc) bin/rails db:test:prepare test

  js-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install root workspace dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Build workspace packages and production web app
        run: npm run build

      - name: Run API client, services, web, and MCP tests
        env:
          TZ: America/Toronto
        run: npm test

      - name: Run web component tests
        run: npm --prefix apps/web test

  mobile-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install root workspace dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      # Mobile imports these through file: links and Jest maps them to dist/.
      - name: Build shared packages
        run: |
          npm --prefix packages/types run build
          npm --prefix packages/api-client run build
          npm --prefix packages/services run build

      - name: Install mobile dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false --prefix apps/mobile

      - name: Check Expo dependency versions
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Run mobile tests
        working-directory: apps/mobile
        run: npm test -- --runInBand

  # Branch protection requires a check named `test`. This gate keeps that
  # name while the work above runs in parallel; `always()` makes it fail
  # (rather than skip, which would count as passing) when any part fails.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [api-test, js-test, mobile-test]
    if: always()
    steps:
      - name: Require API, JS, and mobile tests to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          for result in ${RESULTS}; do
            [ "${result}" = "success" ] || exit 1
          done

  system-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niftygifty_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: apps/api

      - name: Run Rails system tests
        working-directory: apps/api
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/niftygifty_test
          PARALLEL_WORKERS: '1'
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_id }}
          path: apps/api/tmp/screenshots
          if-no-files-found: ignore
          retention-days: 7
