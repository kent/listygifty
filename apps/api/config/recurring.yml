#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  cleanup_oauth_credentials:
    class: OauthCredentialCleanupJob
    schedule: every hour at minute 20

  cleanup_unattached_uploads:
    class: ActiveStorageCleanupJob
    schedule: at 3:30am every day

  send_seasonal_reminders:
    class: SendSeasonalRemindersJob
    schedule: at 9am every day

  send_digest:
    class: SendDigestJob
    schedule: at 8am every day

development:
  send_seasonal_reminders:
    class: SendSeasonalRemindersJob
    schedule: at 9am every day

  send_digest:
    class: SendDigestJob
    schedule: at 8am every day
