default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 5) } %>

development:
  <<: *default
  database: niftygifty_development

test:
  <<: *default
  database: niftygifty_test

staging:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  # At this traffic most requests arrive more than five minutes after the
  # last, and Rails' default idle_timeout (300s) had closed the connection, so
  # they paid to reconnect through the Cloud SQL connector (about 2x slower).
  # Keep connections open instead and ping idle ones every four minutes so
  # nothing on the path drops them. This doesn't raise the connection budget:
  # each process still opens at most its pool size, which the instance cap in
  # infra/pulumi/Pulumi.production.yaml already allows for.
  idle_timeout: 0
  keepalive: 240
